x-pointer-notes:
  withdrawn:
  - type: Sandbox
    reason: >-
      Withdrawn 2026-08-12. api-test.appnexus.com appears only inside a curl -v trace in
      the docs and 404s when probed; Xandr publishes no sandbox, test mode or test
      credentials. See sandbox/appnexus-sandbox.yml.
  not_emitted:
  - type: WellKnown
    reason: >-
      Every /.well-known path 404s on api.appnexus.com. www.appnexus.com and www.xandr.com
      301 to about.ads.microsoft.com, whose SPA answers 200 with an HTML shell for every
      path - a soft-404, not a document. See well-known/appnexus-well-known.yml.
  - type: AgentCard
    reason: no agent-card.json or agent.json on any host; search-only artifact, nothing written.
  - type: CLI
    reason: >-
      anx-cli exists on npm but its only release is 0.1.10 from 2016-03-31 and the current
      documentation never mentions a CLI. Artifact kept at cli/appnexus-cli.yml as an
      abandonment record; no pointer emitted. See cli/appnexus-cli.yml.
  - type: Idempotency
    reason: no Idempotency-Key contract is documented anywhere in the Digital Platform API.
  - type: [OpenAPI, AsyncAPI, Webhooks, MCPServer, AgentSkill, OAuthScopes, Overlay, Protobuf]
    reason: >-
      No machine-readable contract of any kind is published, and there is no event/webhook
      surface, MCP server or OAuth scope model to describe. Skills and overlays have no
      spec to ground them in.
  - type: [Pricing, TermsOfService, PrivacyPolicy]
    reason: >-
      Explicitly not public - "The Xandr Service Policies, Privacy Regulations, Platform
      Terms of Service and Online Terms are confidential and tied to specific contracts
      between Xandr and its customers." See plans/appnexus-plans-pricing.yml.
