aid: appnexus
name: AppNexus
description: >-
  AppNexus was a New York-based programmatic advertising technology company that ran one of the
  largest independent real-time online ad exchanges alongside a cloud-based buy-side and sell-side
  platform for advertisers, agencies, and publishers. AT&T acquired AppNexus in 2018 and rebranded
  it Xandr; Microsoft acquired Xandr in 2022 and productized it as Microsoft Monetize (sell-side)
  and Microsoft Invest (buy-side). Its developer surface lives on as the Digital Platform API
  (host api.appnexus.com) - a RESTful JSON API of roughly 150 services covering advertisers,
  insertion orders, line items, campaigns, creatives, publishers, sites, placements, deals and
  reporting - plus the actively released AppNexus mobile advertising SDKs for Android and iOS.
  Microsoft is discontinuing the Invest DSP effective 28 February 2026; the Monetize sell-side
  platform and the API remain live, documented on Microsoft Learn. No OpenAPI, MCP server or
  agent card is published, and API access is restricted to contracted customers.
  This profile was enriched by the API Evangelist pipeline from the public developer documentation.
