summary: >-
  AppNexus shipped a first-party command line interface for the Digital Platform API,
  anx-cli ("AppNexus HBAPI Command Line Interface"), published to npm and to
  github.com/appnexus/anx-cli. It has not been touched since 2016 and there is no
  successor CLI: the current documentation never mentions a command line client, and the
  only maintained first-party client is the anx-api JavaScript library. Recorded as an
  abandonment finding, not as a live capability.
