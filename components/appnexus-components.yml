summary: >-
  AppNexus/Xandr's client-side component surface is an AD-RENDERING component set, not an
  embedded-dashboard or checkout-element set. The mobile SDKs ship named ad-unit view
  classes that a publisher app drops into its layout, and a separate React design system
  (Lucid) was open-sourced for building console UIs. There is no embeddable reporting or
  console widget for the Digital Platform API itself.
