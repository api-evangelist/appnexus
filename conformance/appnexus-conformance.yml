api: Digital Platform API
summary: >-
  The Digital Platform API is a hand-rolled REST/JSON API predating most of the modern
  HTTP interop RFCs, and it conforms to almost none of them - no OpenAPI, no OAuth 2.0,
  no RFC 9457 problem+json, no standard RateLimit headers. Where AppNexus/Xandr DOES
  carry heavy standards weight is the ad-tech industry layer: it holds board seats at
  IAB Tech Lab, NAI, TAG and Prebid.org and states those memberships in its own docs.
conformance:
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI/Swagger document is published at any AppNexus/Xandr host or in the
    github.com/appnexus org; api.appnexus.com/openapi.json and /swagger.json both 404.
    The ~150 services are documented only as prose reference pages on Microsoft Learn.
- id: oauth2
  conforms: false
  evidence: >-
    Authentication is a proprietary username/password -> session-token exchange at
    POST /auth, carried in an Authorization header or a cookie. No authorization server,
    no scopes, no grant types. /.well-known/oauth-authorization-server 404s.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on api.appnexus.com.
- id: jwt
  conforms: true
  evidence: >-
    "For the Digital Platform API, we've implemented a signed token-based authentication
    system. This system uses JSON Web Tokens (JWT) to help ensure your sessions are as
    secure as possible." - Token-based API Authentication.
  docs: https://learn.microsoft.com/en-us/xandr/digital-platform-api/token-based-api-authentication
- id: rfc9457
  conforms: false
  evidence: >-
    Errors are returned inside the proprietary {"response": {"error_id": ..., "error": ...}}
    envelope, not application/problem+json. See errors/appnexus-error-codes.yml.
- id: rfc6585-retry-after
  conforms: true
  evidence: >-
    429 Too Many Requests and 503 Service Unavailable are both returned with a Retry-After
    header carrying seconds to wait. See rate-limits/appnexus-rate-limits.yml.
- id: ietf-ratelimit-headers
  conforms: false
  evidence: >-
    Uses proprietary x-ratelimit-code / x-ratelimit-count / x-an-user-id instead of the
    IETF RateLimit / RateLimit-Policy draft headers or the X-RateLimit-* triad.
- id: pagination
  conforms: true
  style: offset
  evidence: >-
    start_element / num_elements query parameters, hard cap of 100 objects per GET
    response, with a "count" property on every GET response giving the total matching.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key contract is documented anywhere in the Digital Platform API docs.
    PUT is a field-merge; arrays are overwritten unless ?append=true is supplied.
- id: rest-http-verbs
  conforms: true
  evidence: >-
    POST=create, GET=read, PUT=update, DELETE=delete, applied consistently across services.
- id: https-only
  conforms: true
  evidence: >-
    "HTTPS only (non-secure HTTP not available)"; TLS 1.2 observed on api.appnexus.com
    with a certificate valid to 2027-01-10.
