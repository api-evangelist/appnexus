    Mobile App Service, Mobile App Instance Service, Network Service, Object Limit Service,
    Operating System Service, Operating System Family Service, Operating System Extended Service,
    Political District Service, Postal Code Service, Program Type Service, Rating Service,
    Region Service, Search Service, Technical Attribute Service]
