  buy_side_retirement:
    product: Microsoft Invest (formerly Xandr Invest, formerly the AppNexus DSP)
    effective: '2026-02-28'
    finding: >-
      Microsoft announced it is discontinuing its demand-side platform, stating it is
      "exclusively focusing our buy-side advertising technology investments on the Microsoft
      Advertising Platform" from 2026. The buy-side services of the Digital Platform API
      (advertiser, insertion order, line item, campaign, creative, profile) were built for
      that DSP. The invest/release-notes surface has not carried a new entry since
      2025-09-23, while monetize/release-notes is still shipping monthly - the divergence
      is visible in the provider's own changelog.
    source: https://learn.microsoft.com/en-us/xandr/invest/release-notes
    caveat: >-
      Microsoft has not published a Digital Platform API sunset date. The API host is live
      (api.appnexus.com/auth answers HTTP 400 to an empty POST) and the reference docs were
      last revised 2025-10-22, with the breaking-changes policy page revised 2026-01-27.
  sell_side_status:
    product: Microsoft Monetize (sell-side / SSP, formerly Xandr Monetize)
    active: true
    evidence: monetize/release-notes carries dated entries through 2026-04-01
versioning:
  scheme: uri-path
  current: https://api.appnexus.com/ (also /current/)
  pinned_example: https://api.appnexus.com/v1.16/
  reported_version_field: >-
    Every response carries dbg_info.version, e.g. "1.18.349" in the documented example -
    the running build, not the URI version.
  docs: https://learn.microsoft.com/en-us/xandr/digital-platform-api/api-best-practices
deprecation:
  policy: >-
    "When we introduce a breaking change into our API, we will support two versions of the
    API in production, one with and one without the breaking change, for 60 days. Also, we
    will notify API users of these changes and how to correctly reach each version during
    the breaking changes period. If your user account is enabled for the API, you will
    receive breaking change communications automatically."
  policy_url: https://learn.microsoft.com/en-us/xandr/digital-platform-api/breaking-changes
  policy_last_updated: '2026-01-27'
  notification_channel: direct email to API-enabled user accounts (not a public feed)
  sunset_header: false
  sunset_header_note: >-
    No RFC 8594 Sunset or Deprecation response header is documented. Deprecation is
    announced by email and by parallel versioned URLs, so an automated client cannot
    detect an impending breaking change from the wire.
  qualifies_as_breaking:
  - removal of a field
  - change of a field from non-mandatory to mandatory
  - addition of new validation rules
  - modification of the data type of a field
  - modification of throttling of requests
  - reduction in the number of objects returned by responses
  explicitly_not_breaking:
  - addition of a new non-mandatory field
  - addition of a new service
  - addition of metrics/dimensions to reports
  - addition of a new report type
  - deprecation of a field without removing it
  - reduction or increase in the number of concurrent reports allowed
  - appending a new field to a log-level data feed
  - change in order of fields in an object or array
  reserved_rights: >-
    "We reserve the right to fix bugs, adjust functionality to comply with our Part of
    Service Policies and legal obligations, and change features and products in alpha and
    beta without providing early notice."
  forward_compatibility_requirement: >-
    Integrations must tolerate additional response fields being added over time.
