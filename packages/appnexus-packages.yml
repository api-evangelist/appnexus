source: >-
  Maven Central (repo1.maven.org maven-metadata.xml), CocoaPods trunk API, registry.npmjs.org,
  pypi.org, github.com/appnexus
note: >-
  Two distinct client-library families. The MOBILE ADVERTISING SDKs (Android/iOS) are the
  live, actively shipped ones - v9.13.0 landed on 2026-06-10 on both platforms - but they
  wrap the ad-serving runtime, not the Digital Platform API. The only maintained client
  for the Digital Platform API itself is anx-api on npm. Versions and dates below were
  read from each registry's own metadata endpoint on 2026-08-12.
packages:
- language: javascript
  registry: npm
  name: anx-api
  url: https://www.npmjs.com/package/anx-api
  install: npm install anx-api --save
  repo: https://github.com/appnexus/anx-api
  version: 8.2.1
  published: '2025-11-10'
  official: true
  wraps: Digital Platform API
  note: >-
    "AppNexus Api Wrapper" - the first-party JavaScript/TypeScript client for
    api.appnexus.com. Handles the session-token login, rate limiting and a configurable
    concurrency limit. The only Digital Platform API client library still receiving
    releases.
