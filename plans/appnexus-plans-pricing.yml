note: >-
  Xandr publishes no plans, tiers, or list prices for the Digital Platform API. There is
  no self-serve sign-up and no free tier. The support page states the position plainly:
  "The Xandr API services are for use by current Xandr customers. Service endpoints are
  available only to customers with active accounts and API permissions." API credentials
  are issued through the API Onboarding Process, which runs through a Xandr/Microsoft
  account representative. Commercial terms are explicitly not public - the Policies and
  Regulations page states that "The Xandr Service Policies, Privacy Regulations, Platform
  Terms of Service and Online Terms are confidential and tied to specific contracts
  between Xandr and its customers." Platform economics are ad-spend-based (media fees,
  rev-share, data fees) negotiated per contract, not API-call-metered.
