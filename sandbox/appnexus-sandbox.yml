correction: >-
  A previous pass recorded api-test.appnexus.com as a documented test environment. Re-read
  on 2026-08-12: that hostname appears exactly once in the documentation, inside the Host
  header of a `curl -v` output sample on the API Best Practices page. It is never named as
  an environment, never given a base URL, and has no onboarding path. Probing it returns
  HTTP 404 on / and on every /.well-known path. Xandr publishes NO sandbox, no test mode,
  no test credentials and no synthetic fixtures. Recorded as an honest absence, and the
  apis.yml Sandbox pointer has been withdrawn accordingly.
environments:
- name: production
  base_url: https://api.appnexus.com
  status: live
  note: >-
    The only environment. Every documented example targets it. "Live environment - changes
    affect production."
- name: api-test.appnexus.com
  base_url: null
  status: not-a-documented-environment
  probe_status: 404
  note: >-
    Appears only inside a verbose curl trace on the API Best Practices page. Not published
    as an environment; do not treat as a sandbox.
test_mode:
  present: false
