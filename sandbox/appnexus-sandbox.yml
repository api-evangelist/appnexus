  gate_source: https://learn.microsoft.com/en-us/xandr/digital-platform-api/xandr-api-support
finding: >-
  There is no way for a developer without a signed Xandr contract to make a single
  successful call. The reference documentation is fully public and readable; the runtime
  is not reachable at all. That is a sales gate on execution, not on learning.
